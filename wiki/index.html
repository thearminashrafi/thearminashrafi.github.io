<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wiki — Armin Ashrafi</title>
  <meta name="description" content="Personal knowledge base — notes on reinforcement learning, mathematics, and ideas." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="manifest.js"></script>
  <style>
    .controls {
      display: flex; gap: 12px; flex-wrap: wrap;
      align-items: center; margin-bottom: 40px;
    }
    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 14px; border-radius: 6px;
      font-size: 13px; font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text-2);
      cursor: pointer; transition: all var(--t);
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .search-wrap {
      flex: 1 1 240px; display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-radius: 7px;
      border: 1.5px solid var(--border); background: var(--bg);
      transition: border-color var(--t);
    }
    .search-wrap:focus-within { border-color: var(--accent); }
    .search-wrap input { border: none; outline: none; flex: 1; background: transparent; color: var(--text); font: inherit; font-size: 14px; }

    .note-list { display: flex; flex-direction: column; }
    .note-item {
      display: grid; grid-template-columns: 100px 1fr;
      gap: 24px; padding: 22px 0;
      border-bottom: 1px solid var(--border);
      transition: all var(--t); text-decoration: none !important;
    }
    .note-item:first-child { border-top: 1px solid var(--border); }
    .note-item:hover .note-title { color: var(--accent); }
    .note-date { font-size: 13px; color: var(--muted); font-weight: 500; padding-top: 3px; }
    .note-title { font-size: 17px; font-family: var(--serif); font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
    .note-excerpt { font-size: 14px; color: var(--text-2); line-height: 1.65; margin-bottom: 10px; }
    .note-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .empty { padding: 48px 0; color: var(--muted); font-size: 15px; }
    .loading { padding: 48px 0; color: var(--muted); font-size: 15px; }

    @media (max-width: 520px) {
      .note-item { grid-template-columns: 1fr; gap: 6px; }
      .note-date { padding-top: 0; }
    }
  </style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="../index.html">Armin Ashrafi</a>
    <nav class="nav-links">
      <a href="../research.html">Research</a>
      <a href="../blogs/index.html">Blog</a>
      <a href="index.html" class="active">Wiki</a>
      <a href="../learning.html">Learning</a>
      <a href="../tutoring.html">Tutoring</a>
    </nav>
    <div class="nav-right">
      <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </div>
  </div>
</header>

<main>
  <div class="page">
    <div class="wrap">

      <div class="sh">
        <span class="sh-label">Knowledge Base</span>
        <h1>Wiki</h1>
        <p>Notes on reinforcement learning, mathematics, and ideas I'm actively thinking through.</p>
      </div>

      <div class="controls" id="controls" style="display:none">
        <div class="filter-group" id="tagFilters" role="group" aria-label="Filter by tag">
          <button class="filter-btn active" data-tag="all">All</button>
        </div>
        <label class="search-wrap">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:var(--muted);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="searchInput" type="search" placeholder="Search…" autocomplete="off" />
        </label>
      </div>

      <div id="noteList" class="note-list" aria-live="polite">
        <div class="loading">Loading notes…</div>
      </div>
      <div id="emptyState" class="empty" style="display:none">No notes found.</div>

    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <nav class="footer-nav">
      <a href="../index.html">Home</a>
      <a href="../research.html">Research</a>
      <a href="../blogs/index.html">Blog</a>
      <a href="../learning.html">Learning</a>
      <a href="../tutoring.html">Tutoring</a>
    </nav>
    <p class="footer-copy">© <span id="year"></span> Armin Ashrafi</p>
  </div>
</footer>

<script>
  // Theme
  const root = document.documentElement;
  const btn  = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme');
  const dark  = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches);
  if (dark) root.classList.add('dark');
  btn.textContent = root.classList.contains('dark') ? '☀️' : '🌙';
  btn.addEventListener('click', () => {
    root.classList.toggle('dark');
    const isDark = root.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    btn.textContent = isDark ? '☀️' : '🌙';
  });
  document.getElementById('year').textContent = new Date().getFullYear();

  // ─── Load manifest ────────────────────────────────────────────
  let allNotes = [];
  let currentTag = 'all';

  const fmt = d => d
    ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' })
    : '';

  function noteHTML(n) {
    const tags = (n.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
    const date = fmt(n.date);
    return `
      <a class="note-item" href="page.html?p=${encodeURIComponent(n.path)}" data-tags="${(n.tags||[]).join(',')}" data-search="${(n.title + ' ' + (n.excerpt||'')).toLowerCase()}">
        <div class="note-date">${date}</div>
        <div>
          <div class="note-title">${n.title}</div>
          ${n.excerpt ? `<p class="note-excerpt">${n.excerpt}</p>` : ''}
          <div class="note-meta">${tags}</div>
        </div>
      </a>`;
  }

  function buildTagFilters(notes) {
    const tagSet = new Set();
    notes.forEach(n => (n.tags || []).forEach(t => tagSet.add(t)));
    const filterGroup = document.getElementById('tagFilters');
    filterGroup.innerHTML = '<button class="filter-btn active" data-tag="all">All</button>';
    [...tagSet].sort().forEach(tag => {
      const b = document.createElement('button');
      b.className = 'filter-btn';
      b.dataset.tag = tag;
      b.textContent = tag;
      filterGroup.appendChild(b);
    });
    filterGroup.querySelectorAll('.filter-btn').forEach(b => {
      b.addEventListener('click', () => {
        filterGroup.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        currentTag = b.dataset.tag;
        applyFilters();
      });
    });
  }

  const listEl  = document.getElementById('noteList');
  const emptyEl = document.getElementById('emptyState');

  function applyFilters() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = allNotes.filter(n => {
      const tagOk  = currentTag === 'all' || (n.tags || []).includes(currentTag);
      const textOk = !q || (n.title + ' ' + (n.excerpt||'')).toLowerCase().includes(q);
      return tagOk && textOk;
    });
    if (!filtered.length) { listEl.innerHTML = ''; emptyEl.style.display = 'block'; return; }
    emptyEl.style.display = 'none';
    listEl.innerHTML = filtered.map(noteHTML).join('');
  }

  function initWiki(data) {
    allNotes = data;
    buildTagFilters(allNotes);
    document.getElementById('controls').style.display = 'flex';
    applyFilters();
    document.getElementById('searchInput').addEventListener('input', applyFilters);
  }

  // manifest.js sets window.__WIKI_MANIFEST__ and works on file:// and HTTP alike
  if (window.__WIKI_MANIFEST__) {
    initWiki(window.__WIKI_MANIFEST__);
  } else {
    // fallback: load via script tag (avoids fetch CORS on file://)
    const s = document.createElement('script');
    s.src = 'manifest.js';
    s.onload = () => initWiki(window.__WIKI_MANIFEST__ || []);
    s.onerror = () => {
      listEl.innerHTML = '<div class="empty">No notes yet — add <code>.md</code> files to the <code>wiki/</code> folder and push to GitHub.</div>';
    };
    document.head.appendChild(s);
  }
</script>
</body>
</html>
