name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Quartz can read git last-modified dates

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Build notes with Quartz
        working-directory: quartz
        run: npx quartz build --output ../_site/wiki

      - name: Assemble full site
        run: |
          mkdir -p _site
          # Copy the hand-written site (everything except the Quartz project,
          # the raw notes vault, git internals, and the assembled output itself)
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='quartz' \
            --exclude='wiki' \
            --exclude='_site' \
            --exclude='.claude' \
            --exclude='.vscode' \
            --exclude='.DS_Store' \
            ./ _site/
          # Quartz emits its own CNAME (for the root of a custom domain);
          # it's meaningless nested under /wiki, so drop it.
          rm -f _site/wiki/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
