<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wiki — Armin Ashrafi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="manifest.js"></script>
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <!-- Syntax highlighting -->
  <link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <link id="hljs-dark"  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" disabled>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/bash.min.js"></script>
  <style>
    #progress { position: fixed; top: 0; left: 0; height: 2px; background: var(--accent); z-index: 200; transition: width .1s linear; width: 0; }

    .wiki-head { padding: 56px 0 32px; border-bottom: 1px solid var(--border); }
    .back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 24px; }
    .back:hover { color: var(--accent); text-decoration: none; }
    .wiki-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .wiki-title { font-size: clamp(24px, 4.5vw, 38px); margin-bottom: 14px; }
    .wiki-meta  { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .wiki-nav   { display: flex; justify-content: space-between; gap: 12px; padding: 0 0 64px; margin-top: 8px; }

    /* Obsidian callouts */
    .callout {
      border-left: 3px solid var(--accent);
      background: var(--a-soft);
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
      margin: 20px 0;
    }
    .callout-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--accent); margin-bottom: 6px;
    }
  </style>
</head>
<body>

<div id="progress"></div>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="../index.html">Armin Ashrafi</a>
    <nav class="nav-links">
      <a href="../research.html">Research</a>
      <a href="../blogs/index.html">Blog</a>
      <a href="index.html" class="active">Wiki</a>
      <a href="../learning.html">Learning</a>
      <a href="../tutoring.html">Tutoring</a>
    </nav>
    <div class="nav-right">
      <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </div>
  </div>
</header>

<main class="wrap">

  <header class="wiki-head" id="pageHead">
    <a class="back" href="index.html">← All notes</a>
    <div class="wiki-tags" id="pageTags"></div>
    <h1 class="wiki-title" id="pageTitle">Loading…</h1>
    <div class="wiki-meta" id="pageMeta"></div>
  </header>

  <article class="prose" id="prose-content">
    <p style="color:var(--muted)">Loading…</p>
  </article>

  <nav class="wiki-nav">
    <a class="btn" href="index.html">← All notes</a>
  </nav>

</main>

<footer class="footer">
  <div class="wrap">
    <nav class="footer-nav">
      <a href="../index.html">Home</a>
      <a href="../research.html">Research</a>
      <a href="../blogs/index.html">Blog</a>
      <a href="../learning.html">Learning</a>
      <a href="../tutoring.html">Tutoring</a>
    </nav>
    <p class="footer-copy">© <span id="year"></span> Armin Ashrafi</p>
  </div>
</footer>

<script>
  // Theme
  const root = document.documentElement;
  const btn  = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme');
  const dark  = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches);
  if (dark) root.classList.add('dark');
  function syncTheme() {
    const isDark = root.classList.contains('dark');
    btn.textContent = isDark ? '☀️' : '🌙';
    document.getElementById('hljs-light').disabled = isDark;
    document.getElementById('hljs-dark').disabled  = !isDark;
  }
  syncTheme();
  btn.addEventListener('click', () => {
    root.classList.toggle('dark');
    localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
    syncTheme();
  });
  document.getElementById('year').textContent = new Date().getFullYear();

  // ─── Frontmatter parser ───────────────────────────────────────
  function parseFrontmatter(text) {
    const meta = { title: '', tags: [], date: '' };
    let body = text;
    if (!text.startsWith('---')) return { meta, body };

    const end = text.indexOf('\n---', 3);
    if (end === -1) return { meta, body };

    const fm   = text.slice(3, end);
    body = text.slice(end + 4).trim();

    let inTags = false;
    for (const line of fm.split('\n')) {
      if (line.startsWith('title:')) {
        meta.title  = line.slice(6).trim().replace(/^['"]|['"]$/g, '');
        inTags = false;
      } else if (line.startsWith('date:')) {
        meta.date   = line.slice(5).trim();
        inTags = false;
      } else if (line.startsWith('tags:')) {
        const val = line.slice(5).trim();
        if (val.startsWith('[')) {
          meta.tags = val.slice(1, -1).split(',').map(t => t.trim().replace(/^['"]|['"]$/g, '')).filter(Boolean);
          inTags = false;
        } else {
          inTags = true;
        }
      } else if (inTags && /^\s*-\s+/.test(line)) {
        meta.tags.push(line.replace(/^\s*-\s+/, '').trim());
      } else if (inTags && line.trim() && !/^\s/.test(line)) {
        inTags = false;
      }
    }
    return { meta, body };
  }

  // ─── Wikilink pre-processing ──────────────────────────────────
  // Obsidian links use the display name / stem, not necessarily the exact filename.
  // We do a fuzzy match against the manifest: normalise both sides to lowercase,
  // strip .md, and treat spaces and hyphens as equivalent.
  function normStem(s) {
    return s.toLowerCase().replace(/\.md$/, '').replace(/[\s_-]+/g, '-').trim();
  }

  function resolveWikiLink(target) {
    const needle = normStem(target);
    const manifest = window.__WIKI_MANIFEST__ || [];
    const entry = manifest.find(n => normStem(n.path) === needle || normStem(n.title || '') === needle);
    if (entry) return 'page.html?p=' + encodeURIComponent(entry.path);
    // fallback: best-effort guess
    return 'page.html?p=' + encodeURIComponent(target.trim() + '.md');
  }

  function processWikiLinks(md) {
    // [[Target|Display]] and [[Target]]
    return md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, target, alias) => {
      const display = alias ? alias.trim() : target.trim();
      return `[${display}](${resolveWikiLink(target)})`;
    });
  }

  // ─── Math extraction + KaTeX rendering ───────────────────────
  function renderWithMath(markdown) {
    // Extract math blocks BEFORE marked.js so it doesn't mangle them
    const blocks = [];
    const ph = (type, src) => {
      blocks.push({ type, src });
      return `\x00MATH${blocks.length - 1}\x00`;
    };

    let md = markdown
      // Display math $$...$$
      .replace(/\$\$([\s\S]*?)\$\$/g, (_, tex) => ph('display', tex))
      // Inline math $...$  (not $$ and not empty)
      .replace(/(?<!\$)\$(?!\$)([^$\n]+?)(?<!\$)\$(?!\$)/g, (_, tex) => ph('inline', tex));

    // Obsidian callouts  > [!NOTE]
    md = md.replace(/^> \[!(\w+)\]\n((?:> .*\n?)*)/gm, (_, type, content) => {
      const body = content.replace(/^> ?/gm, '').trim();
      return `<div class="callout"><div class="callout-title">${type}</div>\n\n${body}\n\n</div>\n\n`;
    });

    let html = marked.parse(md);

    // Re-inject KaTeX
    html = html.replace(/\x00MATH(\d+)\x00/g, (_, i) => {
      const { type, src } = blocks[+i];
      try {
        return katex.renderToString(src, { displayMode: type === 'display', throwOnError: false });
      } catch {
        return `<code>$${type === 'display' ? '$' : ''}${src}${type === 'display' ? '$$' : '$'}</code>`;
      }
    });

    return html;
  }

  // ─── Load page from manifest (no fetch — works on file:// too) ──
  const params   = new URLSearchParams(location.search);
  const pagePath = params.get('p');

  function renderNote(entry) {
    const body = entry.content || '';

    // Derive title from first H1 if not in manifest
    const titleMatch = body.match(/^#\s+(.+)/m);
    const title = entry.title || (titleMatch ? titleMatch[1] : pagePath.replace(/\.md$/, '').replace(/-/g, ' '));

    document.title = title + ' — Armin Ashrafi';
    document.getElementById('pageTitle').textContent = title;

    if (entry.date) {
      const d = new Date(entry.date + 'T00:00:00');
      document.getElementById('pageMeta').innerHTML =
        `<span>Armin Ashrafi</span><span>·</span><span>${d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })}</span>`;
    }

    if ((entry.tags || []).length) {
      document.getElementById('pageTags').innerHTML =
        entry.tags.map((t, i) => `<span class="tag${i === 0 ? ' tag-accent' : ''}">${t}</span>`).join('');
    }

    // Strip leading H1 (already shown in header)
    const bodyNoH1 = titleMatch ? body.replace(/^#\s+.+\n?/, '').trim() : body;

    marked.setOptions({ gfm: true, breaks: false });
    document.getElementById('prose-content').innerHTML =
      renderWithMath(processWikiLinks(bodyNoH1));

    document.querySelectorAll('.prose pre code').forEach(b => hljs.highlightElement(b));
  }

  function showNotFound() {
    document.getElementById('pageTitle').textContent = 'Note not found';
    document.getElementById('prose-content').innerHTML =
      `<p>Could not find <code>${pagePath}</code> in the manifest. Make sure the file exists in the <code>wiki/</code> folder and the manifest has been regenerated.</p>`;
  }

  if (!pagePath) {
    document.getElementById('pageTitle').textContent = 'No page specified';
    document.getElementById('prose-content').innerHTML = '<p>Use <code>?p=filename.md</code> to load a note.</p>';
  } else {
    function findAndRender() {
      const manifest = window.__WIKI_MANIFEST__ || [];
      // exact match first, then fuzzy (handles spaces vs hyphens, case)
      const entry = manifest.find(n => n.path === pagePath)
                 || manifest.find(n => normStem(n.path) === normStem(pagePath));
      entry ? renderNote(entry) : showNotFound();
    }

    if (window.__WIKI_MANIFEST__) {
      findAndRender();
    } else {
      const s = document.createElement('script');
      s.src = 'manifest.js';
      s.onload  = findAndRender;
      s.onerror = showNotFound;
      document.head.appendChild(s);
    }
  }

  // Reading progress
  const bar = document.getElementById('progress');
  window.addEventListener('scroll', () => {
    const prose = document.querySelector('.prose');
    if (!prose) return;
    const pct = Math.min(100, Math.max(0,
      (-prose.getBoundingClientRect().top / (prose.offsetHeight - window.innerHeight)) * 100
    ));
    bar.style.width = pct + '%';
  });
</script>
</body>
</html>
