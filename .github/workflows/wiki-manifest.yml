name: Update Wiki Manifest

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**.md'

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 - <<'EOF'
          import json, re
          from pathlib import Path

          wiki_dir = Path('wiki')
          entries = []

          EXCLUDE_DIRS = {'.obsidian', 'templates'}
          for md_file in sorted(wiki_dir.glob('**/*.md')):
              if any(part in EXCLUDE_DIRS for part in md_file.parts):
                  continue
              rel = str(md_file.relative_to(wiki_dir))
              text = md_file.read_text(encoding='utf-8')

              title = md_file.stem.replace('-', ' ').replace('_', ' ').title()
              tags  = []
              date  = ''

              content = text
              if text.startswith('---'):
                  end = text.find('\n---', 3)
                  if end != -1:
                      fm      = text[3:end]
                      content = text[end + 4:].strip()
                      in_tags = False
                      for line in fm.splitlines():
                          if line.startswith('title:'):
                              title   = line[6:].strip().strip('"\'')
                              in_tags = False
                          elif line.startswith('date:'):
                              date    = line[5:].strip()
                              in_tags = False
                          elif line.startswith('tags:'):
                              val = line[5:].strip()
                              if val.startswith('['):
                                  tags = [t.strip().strip('"\'')
                                          for t in val.strip('[]').split(',')
                                          if t.strip()]
                                  in_tags = False
                              else:
                                  in_tags = True
                          elif in_tags and re.match(r'^\s*-\s+', line):
                              tags.append(re.sub(r'^\s*-\s+', '', line).strip())
                          elif in_tags and line and not line.startswith(' '):
                              in_tags = False

              excerpt = ''
              for line in content.splitlines():
                  line = line.strip()
                  if line and not line.startswith('#') and not line.startswith('!') and not line.startswith('---'):
                      excerpt = re.sub(r'[*_`\[\]#>]', '', line)[:200]
                      break

              entries.append({
                  'path':    rel,
                  'title':   title,
                  'tags':    tags,
                  'date':    str(date),
                  'excerpt': excerpt,
                  'content': content,
              })

          entries.sort(key=lambda x: x['date'] or '0000', reverse=True)

          with open('wiki/manifest.json', 'w') as f:
              json.dump(entries, f, indent=2, ensure_ascii=False)

          js = 'window.__WIKI_MANIFEST__ = ' + json.dumps(entries, indent=2, ensure_ascii=False) + ';\n'
          with open('wiki/manifest.js', 'w') as f:
              f.write(js)

          print(f"manifest written — {len(entries)} entries")
          EOF

      - name: Commit manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wiki/manifest.json wiki/manifest.js
          git diff --cached --quiet || git commit -m "chore: update wiki manifest [skip ci]"
          git push
