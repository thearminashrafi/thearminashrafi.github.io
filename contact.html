<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Armin Ashrafi</title>
  <meta name="description" content="Get in touch with Armin Ashrafi." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html">Armin Ashrafi</a>
    <nav class="nav-links">
      <a href="blogs/index.html">Reflections</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </div>
</header>

<main>

  <!-- Contact -->
  <div class="page">
    <div class="wrap">
      <div class="sh">
        <span class="sh-label">Contact</span>
        <h1>Write to me</h1>
        <p>Email is the best way to reach me. Just introduce yourself, say what you are working on, and we will go from there.</p>
      </div>
      <a id="emailBtn" href="#" class="btn btn-fill">Show email address</a>
    </div>
  </div>

</main>

<footer class="footer">
  <div class="wrap">
    <nav class="footer-nav">
      <a href="index.html">Home</a>
      <a href="blogs/index.html">Reflections</a>
    </nav>
    <p class="footer-copy">© <span id="year"></span> Armin Ashrafi</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  document.getElementById('emailBtn').addEventListener('click', function(e) {
    e.preventDefault();
    const addr = 'arminashrafi' + '@' + 'proton.me';
    this.textContent = addr;
    this.href = 'mailto:' + addr;
    this.classList.remove('btn-fill');
    this.style.fontFamily = 'var(--sans)';
  });
</script>
</body>
</html>
